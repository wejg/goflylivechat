# 部署脚本叠加此文件，本地 docker-compose.yml 的使用方式保持不变。
services:
  db:
    restart: unless-stopped
  app:
    image: goflylivechat:deploy
    build: !reset null
    ports: !override
      - "${GOFLY_HTTP_PORT:-8081}:8081"
    command: ["test -f \"$${GOFLY_INSTALL_LOCK}\" && exec /app/gofly server"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/login"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
