services:
  db:
    image: m.daocloud.io/docker.io/library/mariadb:10.11
    environment:
      MARIADB_DATABASE: goflychat
      MARIADB_USER: goflychat
      MARIADB_PASSWORD: ${GOFLY_DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-root-me}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ ! -f \"$${GOFLY_INSTALL_LOCK}\" ]; then /app/gofly install; fi; exec /app/gofly server"]
    environment:
      GIN_MODE: release
      GOFLY_DB_SERVER: db
      GOFLY_DB_PORT: "3306"
      GOFLY_DB_DATABASE: goflychat
      GOFLY_DB_USERNAME: goflychat
      GOFLY_DB_PASSWORD: ${GOFLY_DB_PASSWORD:-change-me}
      GOFLY_INSTALL_LOCK: /data/install.lock
      GOFLY_SESSION_SECRET: ${GOFLY_SESSION_SECRET:-replace-with-a-long-random-secret}
      GOFLY_JWT_SECRET: ${GOFLY_JWT_SECRET:-replace-with-a-long-random-jwt-secret}
      GOFLY_ALLOWED_ORIGINS: ${GOFLY_ALLOWED_ORIGINS:-http://localhost:8081}
      GOFLY_APP_CHAT_ENABLED: ${GOFLY_APP_CHAT_ENABLED:-false}
      GOFLY_ENV: ${GOFLY_ENV:-production}
      GOFLY_APP_API_BASE_URL: ${GOFLY_APP_API_BASE_URL:-}
      GOFLY_APP_PUBLIC_ORIGIN: ${GOFLY_APP_PUBLIC_ORIGIN:-}
      GOFLY_APP_ID: ${GOFLY_APP_ID:-}
      GOFLY_APP_INTEGRATION_KEY: ${GOFLY_APP_INTEGRATION_KEY:-}
      GOFLY_APP_DEFAULT_AGENT: ${GOFLY_APP_DEFAULT_AGENT:-agent}
      # 反代部署时填写代理地址，否则 ClientIP 拿到的是代理 IP，限流和黑名单会失效
      GOFLY_TRUSTED_PROXIES: ${GOFLY_TRUSTED_PROXIES:-}
    ports:
      - "8081:8081"
    volumes:
      - app_data:/data
      - uploads:/app/static/upload
      - avatars:/app/static/avatars
    restart: unless-stopped

volumes:
  db_data:
  app_data:
  uploads:
  avatars:
