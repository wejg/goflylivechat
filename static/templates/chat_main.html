<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>GOFLY - 客服管理后台</title>
    <link rel="stylesheet" href="/static/cdn/element-ui/2.15.1/theme-chalk/index.min.css">
    <script src="/static/cdn/vue/2.6.11/vue.min.js"></script>
    <script src="/static/cdn/element-ui/2.15.1/index.js"></script>
    <script src="/static/cdn/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="/static/css/common.css?v=dgftr65ujhfg">
    <script src="/static/js/functions.js"></script>
    <script src="/static/js/reconnecting-websocket.min.js"></script>
    <script src="/static/js/chat-window.js?v=4"></script>
    <link rel="stylesheet" href="/static/css/chat-window.css?v=2">
    <link rel="stylesheet" href="/static/css/icon/iconfont.css?v=fgjlgfda"/>
    <style>
        html, body {overflow:hidden;height: 100%;padding: 0;margin: 0;background-color: #f5f5f5;}
        .el-row{width:100%}
        .chatLeft{height:100%;margin-left: 4px;overflow:auto;}
        .chatBgContext .el-row{margin-bottom: 5px;}
        .chatBgContext{position: relative;height: 100%;width: 100%;}
        .chatUser{
            line-height: 24px;
            font-size: 12px;
            white-space: nowrap;
            color: #999;
        }

        .chatBoxMe .el-col-3{float: right;text-align: right;}
        .chatBoxMe .chatUser{text-align: right}
        .chatBox{width: 100%;height:calc(100% - 170px);;overflow-y: auto;overflow-x: hidden;}
        .chatTime{text-align: center;color: #bbb;margin: 5px 0;font-size: 12px;}
    </style>
</head>
<body>
<div id="app" class="chatMainPage">
    <template>
        <el-row>
            <el-col :span="5">
                <div class="chatBg chatLeft">
                    <div style="padding:0 12px;text-align:right">
                        <el-button type="text" icon="el-icon-check" :loading="markingAllRead" :disabled="!unreadLastMessageId" @click="markAllMessagesRead">一键已读</el-button>
                    </div>
                    <el-tabs v-model="leftTabActive" @tab-click="handleTabClick">
                        <el-tab-pane label="在线访客" name="first">
                            <el-row v-for="item in users" :key="item.uid" class="">
                                <div :title="item.last_message" style="cursor:pointer" class="onlineUsers hasLastMsg" v-bind:class="{'cur': item.uid==currentGuest }" v-on:click="talkTo(item.uid,item.username)">
                                    <el-col :span="4">
                                        <el-badge :value="unreadVisitors[item.uid] || 0" :hidden="!unreadVisitors[item.uid]" class="item">
                                            <el-avatar :size="40" :src="item.avator"></el-avatar>
                                        </el-badge>
                                    </el-col>
                                    <el-col :span="16">
                                        <div style="height:20px;overflow: hidden"><{item.username}></div>
                                        <div class="lastNewMsg"><{item.last_message}></div>
                                    </el-col>
                                </div>
                            </el-row>
                        </el-tab-pane>
                        <el-tab-pane label="最近访客" name="second">
                            <el-row v-for="item in visitors" :key="item.visitor_id" class="">
                                <div style="cursor:pointer" class="onlineUsers" v-bind:class="{'cur': item.visitor_id==currentGuest }" v-on:click="talkTo(item.visitor_id,item.name)">
                                    <el-col :span="4">
                                        <el-badge :value="unreadVisitors[item.visitor_id] || 0" :hidden="!unreadVisitors[item.visitor_id]" class="item">
                                            <el-avatar :size="40" :src="item.avator"></el-avatar>
                                        </el-badge>
                                    </el-col>
                                    <el-col style="height:40px;overflow: hidden" :span="16">
                                        <div style="height:20px;overflow: hidden"><{item.name}></div>
                                        <div class="lastNewMsg"><{item.last_message}></div>
                                    </el-col>
                                </div>
                            </el-row>
                            <el-pagination
                                    v-show="visitorCount>visitorPageSize"
                                    background
                                    @current-change="visitorPage"
                                    :current-page="visitorCurrentPage"
                                    layout="prev,pager, next"
                                    :page-size="visitorPageSize"
                                    :total="visitorCount">
                            </el-pagination>
                        </el-tab-pane>
                    </el-tabs>
                </div>
            </el-col>

            <el-col :span="13">
                <div class="kefuMainBg chatBgContext">
                    <el-alert
                            :closable="false"
                            :type="chatTitleType"
                            show-icon
                            :title="chatTitle+chatInputing">
                    </el-alert>

                    <div class="kefuFuncBtns" v-if="visitor.visitor_id" style="display: none">
                        <el-button v-on:click="getMesssagesByVisitorId(visitor.visitor_id,true)" size="small" type="success" plain icon="el-icon-user">加载全部</el-button>
                        <el-button v-on:click="transKefu" size="small" type="success" plain icon="el-icon-position">转接</el-button>
                        <el-button v-on:click="closeVisitor(visitor.visitor_id)" size="small" type="success" plain icon="el-icon-close">结束会话</el-button>
                    </div>

            <chat-window ref="messageList" class="chatBox" :items="msgList" :older="showLoadMore" :newer="hasNewer" :loading="historyLoading"
                         @older="getHistoryMessage" @newer="getNewerMessages" @latest="showLatestMessages" @position="onListPosition">
                <template slot-scope="row">
                        <el-row :gutter="2" v-bind:class="{'chatBoxMe': row.item.is_kefu==true}">
                            <div class="chatTime"><{row.item.time}></div>
                            <div class="chatRow">
                                <el-avatar v-if="row.item.is_kefu==false" class="chatRowAvator" :size="48" :src="row.item.avator"></el-avatar>
                                <div class="chatMsgContent">
                                    <div class="chatUser"><{row.item.name}></div>
                                    <div class="chatContent" v-html="row.item.content"></div>
                                </div>
                                <el-avatar v-if="row.item.is_kefu==true" class="chatRowAvator" :size="48" :src="row.item.avator"></el-avatar>
                            </div>
                        </el-row>
                </template>
            </chat-window>

                    <div class="kefuFuncBox">
                        <div class="iconBtnsBox">
                            <div class="faceBox kefuFaceBox" v-show="showFaceIcon">
                                <ul class="faceBoxList">
                                    <li v-on:click="faceIconClick(i)" class="faceIcon" v-for="(v,i) in face" :title="v.name"><img :src=v.path></li>
                                </ul>
                                <div class="clear"></div>
                            </div>

                            <el-tooltip content="发送表情" placement="top">
                                <div class="iconBtn iconfont icon-xiaolian" style="font-size: 24px;" @click.stop="showFaceIcon==true?showFaceIcon=false:showFaceIcon=true"></div>
                            </el-tooltip>

                            <el-tooltip content="上传图片" placement="top">
                                <div class="iconBtn el-icon-picture" id="uploadImg" v-on:click="uploadImg('/uploadimg')" style="font-size: 24px;"></div>
                            </el-tooltip>

                            <el-tooltip content="上传文件" placement="top">
                                <div class="iconBtn el-icon-upload" id="uploadFile" v-on:click="uploadFile('/uploadfile')" style="font-size: 26px;"></div>
                            </el-tooltip>
                        </div>

                        <div class="clear"></div>
                        <el-button class="kefuSendBtn" :disabled="sendDisabled" size="mini" type="primary" v-on:click="chatToUser">发送</el-button>
                        <el-input type="textarea" :autosize="{ minRows: 8, maxRows: 12}" class="chatArea" v-model="messageContent" v-on:keyup.enter.native="chatToUser" placeholder="请输入消息"></el-input>
                    </div>
                </div>
            </el-col>

            <el-col :span="6" class="chatRight">
                <div class="chatBg">
                    <el-tabs v-model="rightTabActive" @tab-click="handleTabClick">
                        <el-tab-pane label="访客信息" name="visitorInfo">
                            <el-menu class="visitorInfo" v-show="visitor.visitor_id">
                                <el-tooltip content="点击加入黑名单" placement="left">
                                    <el-menu-item v-on:click="addIpblack(visitor.source_ip)" title="点击加入黑名单" style="padding-left:2px;color: #666;">
                                        <i class="el-icon-user"></i>
                                        <span slot="title">IP: <{visitor.source_ip}></span>
                                    </el-menu-item>
                                </el-tooltip>

                                <el-menu-item v-on:click="openUrl('https://www.baidu.com/s?wd='+visitor.client_ip)" style="padding-left:2px;color: #666;">
                                    <i class="el-icon-map-location"></i>
                                    <span slot="title">位置： <{visitor.city}></span>
                                </el-menu-item>

                                <el-menu-item style="padding-left:2px;color: #666;">
                                    <i class="el-icon-time"></i>
                                    <span slot="title">首次访问： <{visitor.created_at}></span>
                                </el-menu-item>

                                <el-menu-item style="padding-left:2px;color: #666;">
                                    <i class="el-icon-time"></i>
                                    <span slot="title">最后活跃： <{visitor.updated_at}></span>
                                </el-menu-item>

                                <el-tooltip :content="visitor.refer" placement="left">
                                    <el-menu-item style="padding-left:2px;color: #666;">
                                        <i class="el-icon-guide"></i>
                                        <span slot="title">来源： <{visitor.refer}></span>
                                    </el-menu-item>
                                </el-tooltip>

                                <el-tooltip v-for="v in visitorExtra" :content="v.val" placement="left">
                                    <el-menu-item style="padding-left:2px;color: #666;">
                                        <i class="el-icon-paperclip"></i>
                                        <span slot="title"><{v.key}>: <{v.val}></span>
                                    </el-menu-item>
                                </el-tooltip>
                            </el-menu>
                        </el-tab-pane>

                        <el-tab-pane label="黑名单" name="blackList">
                            <el-row v-for="item in ipBlacks" :key="item.id" class="">
                                <el-tooltip content="点击移除" placement="left">
                                    <div v-on:click="delIpblack(item.ip)" style="cursor:pointer" class="onlineUsers imgGray">
                                        <{item.ip}>
                                    </div>
                                </el-tooltip>
                            </el-row>
                        </el-tab-pane>
                    </el-tabs>
                </div>

                <div class="replyBox">
                    <div class="chatRightTitle">快捷回复
                        <a href="javascript:void(0);" @click="replyGroupDialog = true">+ 添加分组</a>
                    </div>

                    <el-input placeholder="搜索快捷回复..." v-model="replySearch" class="replySearch" @keyup.enter="searchReply">
                        <el-button slot="append" icon="el-icon-search" @click="searchReply"></el-button>
                    </el-input>

                    <div class="replyContent">
                        <el-collapse v-show="replySearchList" v-model="replySearchListActive">
                            <el-collapse-item v-for="reply in replySearchList" :key="reply.group_id" :title="reply.group_name" :name="reply.group_id">
                                <template slot="title">
                                    <i class="el-icon-folder"></i>&nbsp;<{reply.group_name}>
                                </template>
                                <div class="replyItem" @click="messageContent=item.item_content" v-for="item in reply.items">
                                    <{item.item_content}> &nbsp;&nbsp;
                                    <el-button @click="deleteReplyContent(item.item_id)" type="text">删除</el-button>
                                </div>
                                <el-button @click="replyContentDialog=true;groupName=reply.group_name;groupId=reply.group_id" type="text">+ 添加回复</el-button>
                                <el-button @click="deleteReplyGroup(reply.group_id)" type="text">- 删除分组</el-button>
                            </el-collapse-item>
                        </el-collapse>

                        <el-collapse v-show="replySearchList.length==0">
                            <el-collapse-item v-for="reply in replys" :key="reply.group_id" :title="reply.group_name" :name="reply.group_id">
                                <template slot="title">
                                    <i class="el-icon-s-order"></i>&nbsp;<{reply.group_name}>
                                </template>
                                <div class="replyItem" @click="messageContent=item.item_content" v-for="item in reply.items">
                                    <el-popover placement="left" width="300" trigger="hover">
                                        <div v-html="replaceContent(item.item_content)"></div>
                                        <div class="replyItemTitle" slot="reference">
                                            <i class="header-icon el-icon-document"></i> <{item.item_name}>
                                        </div>
                                    </el-popover>
                                    <el-button @click="editReplyContent('no',item.item_id,item.item_name,item.item_content)" type="text">编辑</el-button>
                                    <el-button @click="deleteReplyContent(item.item_id)" type="text">删除</el-button>
                                </div>
                                <el-button @click="replyContentDialog=true;groupName=reply.group_name;groupId=reply.group_id" type="text">+ 添加回复</el-button>
                                <el-popover placement="top" width="100" v-model="visible">
                                    <p>确认删除？</p>
                                    <div style="text-align: right; margin: 0">
                                        <el-button size="mini" type="text" @click="visible = false">取消</el-button>
                                        <el-button type="primary" size="mini" @click="visible = false;deleteReplyGroup(reply.group_id)">确认</el-button>
                                    </div>
                                    <el-button slot="reference" type="text">- 删除分组</el-button>
                                </el-popover>
                            </el-collapse-item>
                        </el-collapse>
                    </div>
                </div>
            </el-col>
        </el-row>

        <!-- Image Preview -->
        <div id="bigPic" class="bigPic">
            <img src="/static/images/3.jpg"/>
        </div>

        <!-- Audio Elements -->
        <audio id="chatMessageAudio">
            <source id="chatMessageAudioSource" src="/static/images/alert2.ogg" type="audio/mpeg" />
        </audio>
        <audio id="chatMessageSendAudio">
            <source id="chatMessageSendAudioSource" src="/static/images/sent.ogg" type="audio/mpeg" />
        </audio>

        <!-- Transfer Dialog -->
        <el-dialog title="转接会话" :visible.sync="transKefuDialog" width="30%" top="0">
            <el-table :data="otherKefus" style="width: 100%">
                <el-table-column prop="nickname" label="客服"></el-table-column>
                <el-table-column prop="status" label="操作">
                    <template slot-scope="scope">
                        <el-tag v-show="scope.row.status=='offline'" disable-transitions>离线</el-tag>
                        <el-button v-show="scope.row.status=='online'" type="primary" @click="transKefuVisitor(scope.row.name,visitor.visitor_id)">转接</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <span slot="footer" class="dialog-footer">
                <el-button @click="transKefuDialog = false">取消</el-button>
            </span>
        </el-dialog>

        <!-- Reply Group Dialog -->
        <el-dialog title="添加分组" :visible.sync="replyGroupDialog" width="30%" top="0">
            <el-input v-model="groupName"></el-input>
            <span slot="footer" class="dialog-footer">
                <el-button @click="addReplyGroup">保存</el-button>
                <el-button @click="replyGroupDialog = false">取消</el-button>
            </span>
        </el-dialog>

        <!-- Reply 内容 Dialogs -->
        <el-dialog title="添加快捷回复" :visible.sync="replyContentDialog" width="30%" top="0">
            <el-input style="margin-bottom: 10px;" placeholder="关键词" v-model="replyTitle"></el-input>
            <el-input placeholder="内容" type="textarea" v-model="replyContent"></el-input>
            <span slot="footer" class="dialog-footer">
                <el-button @click="addReplyContent">保存</el-button>
                <el-button @click="replyContentDialog = false">取消</el-button>
            </span>
        </el-dialog>

        <el-dialog title="编辑快捷回复" :visible.sync="editReplyContentDialog" width="30%" top="0">
            <el-input style="margin-bottom: 10px;" placeholder="关键词" v-model="replyTitle"></el-input>
            <el-input placeholder="内容" type="textarea" v-model="replyContent"></el-input>
            <span slot="footer" class="dialog-footer">
                <el-button @click="editReplyContent('yes')">保存</el-button>
                <el-button @click="editReplyContentDialog = false">取消</el-button>
            </span>
        </el-dialog>
    </template>
</div>
</body>
<script>
    var app=new Vue({
        el: '#app',
        delimiters:["<{","}>"],
        data: {
            visible:false,
            chatTitleType:"info",
            fullscreenLoading:true,
            leftTabActive:"first",
            rightTabActive:"visitorInfo",
            users:[],
            unreadVisitors:{},
            unreadRequest:0,
            unreadLastMessageId:0,
            markingAllRead:false,
            usersMap:[],
            server:getWsBaseUrl()+"/ws_kefu?token="+localStorage.getItem("token"),
            //server:getWsBaseUrl()+"/chat_server",
            socket:null,
            pingTimer:null,
            onlineTimer:null,
            socketClosed:false,
            messageContent:"",
            currentGuest:"",
            msgList:[],
            chatTitle:"暂无待处理咨询",
            chatInputing:"",
            kfConfig:{
                id : "kf_1",
                name : "客服丽丽",
                avator : "",
                to_id : "",
            },
            visitor:{
                visitor_id:"",
                refer:"",
                client_ip:"",
                city:"",
                status:"",
                source_ip:"",
                created_at:"",
            },
            visitorExtra:[],
            visitors:[],
            visitorCount:0,
            visitorCurrentPage:1,
            visitorPageSize:20,
            face:[],
            transKefuDialog:false,
            otherKefus:[],
            replyGroupDialog:false,
            replyContentDialog:false,
            editReplyContentDialog:false,
            replySearch:"",
            replySearchList:[],
            replySearchListActive:[],
            groupName:"",
            groupId:"",
            replys:[],
            replyId:"",
            replyContent:"",
            replyTitle:"",
            ipBlacks:[],
            sendDisabled:false,
            showFaceIcon:false,
            showLoadMore:false,
            historyRequest:0,
            historyLoading:false,
            hasNewer:false,
            listAtBottom:true,
            newerVersion:0,
            newerCursor:null,
            visibleMessageId:0,
            messages:{
                page:1,
                pagesize:15,
                list:[],
            },
        },
        methods: {
            //跳转
            openUrl(url) {
                window.location.href = url;
            },
            sendKefuOnline(){
                let mes = {}
                mes.type = "kfOnline";
                mes.data = this.kfConfig;
                this.socket.send(JSON.stringify(mes));
            },
            sortMessages(){
                const pending=this.msgList.filter(message=>message.sending);
                const messages=this.msgList.filter(message=>!message.sending);
                const persisted=messages.filter(message=>message.id).sort((a,b)=>a.id-b.id);
                let index=0;
                this.msgList=messages.map(message=>message.id ? persisted[index++] : message).concat(pending);
            },
            trimMessages(direction){
                const cache=ChatWindow.retain(this.msgList,direction || 'newer');
                this.msgList=cache.items;
                if(cache.older){this.showLoadMore=true;}
                if(cache.newer){
                    this.hasNewer=true;
                    const saved=this.msgList.filter(message=>message.id && !message.sending);
                    if(saved.length){this.newerCursor=Math.min(saved[saved.length-1].id,this.newerCursor || Infinity);}
                }
            },
            onListPosition(position){
                this.listAtBottom=position.bottom;
                if(position.lastVisibleId!=this.visibleMessageId){
                    this.visibleMessageId=position.lastVisibleId;
                    if(this.msgList.some(message=>message.id==position.lastVisibleId)){
                        this.markMessagesRead(this.currentGuest,position.lastVisibleId);
                    }
                }
            },
            getNewerMessages(){if(this.newerCursor===0){this.showLatestMessages();}else{this.getHistoryMessage('newer');}},
            showLatestMessages(){
                this.messages.page=1;
                this.historyLoading=false;
                this.listAtBottom=true;
                this.getHistoryMessage();
            },
            //心跳
            ping(){
                let _this=this;
                let mes = {type:"ping", data:""};
                if(this.pingTimer){ clearInterval(this.pingTimer); }
                if(this.onlineTimer){ clearInterval(this.onlineTimer); }
                this.pingTimer=setInterval(function () {
                    if(_this.socket && _this.socket.readyState === WebSocket.OPEN){
                        _this.socket.send(JSON.stringify(mes));
                    }
                    _this.getUnreadMessages();
                },20000);
                this.onlineTimer=setInterval(function(){
                    _this.getOnlineVisitors();
                },120000);
            },
            //初始化websocket
            initConn() {
                let socket = new ReconnectingWebSocket(this.server);//创建Socket实例
                this.socket = socket
                this.socket.onmessage = (event) => this.OnMessage(event);
                this.socket.onopen = () => this.OnOpen();
            },
            OnOpen() {
                this.sendKefuOnline();
                this.getUnreadMessages();
            },
            OnMessage(e) {
                const redata = JSON.parse(e.data);
                switch (redata.type){
                    case "close":
                        this.socket.close();
                        this.$alert('客服在其他地方登录，当前登录状态退出', '通知', {
                            confirmButtonText: '确定',
                            callback:function () {
                                localStorage.removeItem("token");
                                window.location.href="/login";
                            }
                        });

                        break;
                    case "inputing":
                        this.handleInputing(redata.data);
                        //this.sendKefuOnline();
                        break;
                    case "allUsers":
                        this.handleOnlineUsers(redata.data);
                        //this.sendKefuOnline();
                        break;
                    case "userOnline":
                        this.addOnlineUser(redata.data);


                        break;
                    case "userOffline":
                        this.removeOfflineUser(redata.data);
                        //this.sendKefuOnline();
                        break;
                    case "notice":
                        //发送通知
                        var _this=this;
                        window.parent.postMessage({
                            name:redata.data.username,
                            body: redata.data.content,
                            icon: redata.data.avator
                        });
                        _this.alertSound();
                        break;
                }


                if (redata.type == "message") {
                    let msg = redata.data
                    let content = {}
                    let _this=this;
                    content.avator = msg.avator;
                    content.name = msg.name;
                    content.content = replaceContent(msg.content);
                    content.is_kefu = msg.is_kefu=="yes"? true:false;
                    content.time = msg.time;
                    content.id = msg.message_id;
                    const follow=this.listAtBottom && !this.hasNewer;
                    if(msg.id==this.currentGuest && !follow){this.hasNewer=true;this.newerVersion++;}
                    if (msg.id == this.currentGuest && follow && (!content.id || !this.msgList.some(message=>message.id==content.id))) {
                        this.newerCursor=Math.max(this.newerCursor || 0,content.id || 0);
                        this.msgList.push(content);
                        this.sortMessages();
                        this.trimMessages();
                    }

                    for(let i=0;i<this.users.length;i++){
                        if(this.users[i].uid==msg.id){
                            this.$set(this.users[i],'last_message',msg.content);
                        }
                    }
                    if(!content.is_kefu){
                        if(this.currentGuest==msg.id && this.chatIsVisible() && follow){
                            this.readCurrentMessages();
                        }else{
                            this.getUnreadMessages();
                        }
                    }
                    if(follow){this.scrollBottom();}
                    if(content.is_kefu){
                        return;
                    }
                    window.parent.postMessage({
                        name:msg.name,
                        body: msg.content,
                        icon: msg.avator

                    });
                    _this.alertSound();
                    _this.chatInputing="";
                }
            },
            //接手客户
            talkTo(guestId,name) {
                this.currentGuest = guestId;
                //发送给客户
                let mes = {}
                mes.type = "kfConnect";
                this.kfConfig.to_id=guestId;
                mes.data = this.kfConfig;
                this.socket.send(JSON.stringify(mes));

                //获取当前访客信息

            getHistoryMessage(direction){
                if(this.historyLoading){ return; }
                this.historyLoading=true;
                const request=++this.historyRequest;
                const newer=direction==='newer';
                const version=this.newerVersion;
                const visitorId=this.currentGuest;
                let params={
                    page:this.messages.page,
                    pagesize: this.messages.pagesize,
                    visitor_id: visitorId,
                }
                const persisted=this.msgList.filter(message=>message.id && !message.sending);
                const boundary=newer ? persisted[persisted.length-1] : persisted[0];
                if(boundary && (newer || params.page>1)){params[newer?'after_id':'before_id']=newer ? (this.newerCursor || boundary.id) : boundary.id;}
                const latest=!newer && params.page==1;
                const previousMessages=new Set(latest ? this.msgList.filter(message=>!message.sending) : []);
                let _this=this;
                $.ajax({
                    url:"/2/messagesPages",
                    type:"get",
                    data:params,
                    headers:{"token":localStorage.getItem("token")},
                    success:function(res){
                    if(res.code!=200 || request!=_this.historyRequest || _this.currentGuest!=visitorId){
                        return;
                    }
                    if(latest){_this.msgList=_this.msgList.filter(message=>!previousMessages.has(message));}
                    let msgList=res.result.list;
                    if(latest){_this.newerCursor=0;}
                    if(latest || newer){
                        for(const message of msgList){_this.newerCursor=Math.max(_this.newerCursor || 0,message.id);}
                    }
                    if(newer){_this.hasNewer=msgList.length>=params.pagesize || version!=_this.newerVersion;}
                    else{_this.showLoadMore=msgList.length>=params.pagesize;}
                    if(latest){_this.hasNewer=version!=_this.newerVersion;}
                    for(let i in msgList){
                        let item = msgList[i];
                        if(_this.msgList.some(message=>message.id==item.id)){ continue; }
                        if (item["mes_type"] == "kefu") {
                            item.is_kefu = true;
                            item.avator=item["kefu_avator"];
                            item.name=item["kefu_name"];
                        } else {
                            item.is_kefu = false;
                            item.avator=item["visitor_avator"];
                            item.name=item["visitor_name"];
                        }
                        item.content=replaceContent(item["content"]);
                        item.time = item["create_time"];
                        _this.msgList.unshift(item);
                    }
                    _this.sortMessages();
                    _this.trimMessages(newer || latest ? 'newer' : 'older');
                    if((newer || latest) && _this.msgList.some(message=>message.id>_this.newerCursor)){_this.hasNewer=true;}
                    _this.readCurrentMessages();
                    if(latest){
                        _this.scrollBottom(true);
                    }
                    if(!newer){_this.messages.page=params.page+1;}
                    },
                    complete:function(){
                        if(request==_this.historyRequest){ _this.historyLoading=false; }
                    }
                });
            },

                    _this.replySearchList=result;
                    for (var i in result) {
                        _this.replySearchListActive.push(result[i].group_id);
                    }
                });
            },
            //获取黑名单
            getIpblacks(){
                var _this=this;
                this.sendAjax("/ipblacks","get",{},function(result){
                    _this.ipBlacks=result;
                });
            },
            //删除黑名单
            delIpblack(ip){
                let _this=this;
                this.sendAjax("/ipblack?ip="+ip,"DELETE",{ip:ip},function(result){
                    _this.sendAjax("/ipblacks","get",{},function(result){
                        _this.ipBlacks=result;
                    });
                });
            },
            //划词搜索
            selectText(){
                return false;
                var _this=this;
                $('body').click(function(){
                    try{
                        var selecter = window.getSelection().toString();
                        if (selecter != null && selecter.trim() != ""){
                            _this.replySearch=selecter.trim();
                            _this.searchReply();
                        }else{
                            _this.replySearch="";
                        }
                    } catch (err){
                        var selecter = document.selection.createRange();
                        var s = selecter.text;
                        if (s != null && s.trim() != ""){
                            _this.replySearch=s.trim();
                            _this.searchReply();
                        }else{
                            _this.replySearch="";
                        }
                    }
                    var status=$('.faceBox').css("display");
                    if(status=="block"){
                        $('.faceBox').hide();
                    }
                });
            },
            sendAjax(url,method,params,callback){
                let _this=this;
                $.ajax({
                    type: method,
                    url: url,
                    data:params,
                    headers: {
                        "token": localStorage.getItem("token")
                    },
                    error:function(res){
                        var data=JSON.parse(res.responseText);
                        console.log(data);
                        if(data.code!=200){
                            _this.$message({
                                message: data.msg,
                                type: 'error'
                            });
                        }
                    },
                    success: function(data) {
                        if(data.code!=200){
                            _this.$message({
                                message: data.msg,
                                type: 'error'
                            });
                        }else if(data.result!=null){
                            callback(data.result);
                        }else{
                            callback(data);
                        }
                    }
                });
            },
        },
        mounted() {
            $.ajax({url:'/agent/session',type:'POST',headers:{token:localStorage.getItem('token')||''}});
            document.addEventListener('paste', this.onPasteUpload);
            document.addEventListener('visibilitychange',this.readCurrentMessages);
            window.addEventListener('message',this.handleParentMessage);
        },
        beforeDestroy(){
            document.removeEventListener('paste',this.onPasteUpload);
            document.removeEventListener('visibilitychange',this.readCurrentMessages);
            window.removeEventListener('message',this.handleParentMessage);
            if(this.pingTimer){ clearInterval(this.pingTimer); }
            if(this.onlineTimer){ clearInterval(this.onlineTimer); }
            if(this.socket){ this.socket.close(); }
        },
        created: function () {
            //jquery
            this.initJquery();
            this.getKefuInfo();
            this.getOnlineVisitors();
            this.getUnreadMessages();
            this.getReplys();
            this.getIpblacks();
            this.selectText();
            //心跳
            this.ping();
        }
    })

</script>
</html>
