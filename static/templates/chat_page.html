<!doctype html>
<html lang="zh-CN">
<head>
    <script>
        window.GOFLY_ENTRY_TICKET = new URLSearchParams(window.location.hash.slice(1)).get('ticket') || '';
        if (window.GOFLY_ENTRY_TICKET) history.replaceState(null, '', window.location.pathname + window.location.search);
        window.addEventListener('hashchange', function () {
            if (new URLSearchParams(window.location.hash.slice(1)).get('ticket')) window.location.reload();
        });
    </script>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" name="viewport" />
    <meta name="color-scheme" content="light dark">
    <meta name="keywords" content="Golang 开源在线客服系统"/>
    <meta name="description" content="Golang 开源在线客服系统"/>
    <title>客服与帮助</title>
    <link rel="stylesheet" href="/static/cdn/element-ui/2.15.1/theme-chalk/index.min.css">
    <script src="/static/cdn/vue/2.6.11/vue.min.js"></script>
    <script src="/static/cdn/element-ui/2.15.1/index.js"></script>
    <script src="/static/cdn/jquery/3.6.0/jquery.min.js"></script>

    <script src="/static/js/functions.js?v=20261101"></script>
    <script src="/static/js/reconnecting-websocket.min.js"></script>
    <script src="/static/js/chat-window.js?v=5"></script>
    <link rel="stylesheet" href="/static/css/chat-window.css?v=3">
    <link rel="stylesheet" href="/static/css/common.css?v=sdsderfrgfgdfdf" />
    <link rel="stylesheet" href="/static/css/icono.min.css" />
    <link rel="stylesheet" href="/static/css/icon/iconfont.css?v=fgjlgfda"/>
    <link rel="stylesheet" href="/static/css/visitor-chat.css?v=5">
</head>
<body class="visitorBody support-chat">
<div id="app" class="chatCenter" v-cloak @click="showFaceIcon=false;showIconBtns=false">
    <template>
        <!--Customer Service Code-->
        <div class="chatEntTitle support-header" v-show="!isIframe">
            <el-avatar class="chatEntTitleLogo" :size="36" :src="kefuInfo.avatar"></el-avatar>
            <div class="support-heading"><h1>客服与帮助</h1><span>描述问题，我们会认真查看</span></div>
        </div>
        <div class="chatEntBox">
            <div class="chat-window-status" :class="{'is-online':showKfonline && !socketClosed && !sessionFailed,'is-error':socketClosed || sessionFailed}" role="status"><span class="support-status-dot" aria-hidden="true"></span><span><{chatTitle}></span></div>
            <section class="support-guide" :class="{'is-collapsed':msgList.length && !guideExpanded}" v-if="historyReady" aria-label="咨询指引">
                <button v-if="msgList.length" type="button" class="support-guide-toggle" :aria-expanded="String(guideExpanded)" aria-controls="support-guidance" @click="guideExpanded=!guideExpanded"><{guideExpanded ? '收起' : '咨询指引'}> <span aria-hidden="true"><{guideExpanded ? '−' : '+'}></span></button>
                <div id="support-guidance" v-show="!msgList.length || guideExpanded">
                    <span class="support-guide-label">咨询指引</span>
                    <h2><{!showKfonline && !serviceOpen ? '休息时间，也可以留言' : '有什么可以帮你？'}></h2>
                    <p><{guidanceText()}></p>
                    <p class="support-hours">服务时间：每天北京时间 10:00–18:00</p>
                    <div class="support-topics" aria-label="选择问题类型"><button v-for="topic in topics" :key="topic" type="button" @click="selectTopic(topic)"><{topic}></button></div>
                </div>
            </section>
            <chat-window ref="messageList" class="chatContext chatVisitorPage chatBox" :items="msgList" :older="showLoadMore" :newer="hasNewer" :loading="historyLoading"
                         @older="getHistoryMessage" @newer="getNewerMessages" @latest="showLatestMessages" @position="onListPosition" @click.native.capture="onMessageClick" @keydown.native.capture="onMessageKeydown" @click.native="$refs.composer.blur()">
                <template slot-scope="row">
                    <div class="support-message" :class="{'chatBoxMe':!row.item.is_kefu,'is-consecutive':isConsecutive(row.item),'is-automatic':!!row.item.auto_reply_type}">
                        <div class="chatTime" v-if="messageTime(row.item)"><span><{messageTime(row.item)}></span></div>
                        <div v-if="row.item.auto_reply_type" class="support-auto-notice"><span class="support-auto-label"><{row.item.auto_reply_type==='offline' ? '自动提示' : '自动回复'}></span><div v-html="row.item.content"></div></div>
                        <div v-else-if="row.item.is_kefu" class="support-message-line">
                            <el-avatar class="support-avatar" :size="30" :src="row.item.avator"></el-avatar>
                            <div class="chatMsgContent">
                                <div class="chatContent chatContent2 replyContentBtn" :class="{'is-image':row.item.imageOnly}" v-html="row.item.content"></div>
                            </div>
                        </div>
                        <div class="kefuMe support-message-line" v-else>
                            <div v-if="row.item.preview" class="chatContent chatContent2 replyContentBtn is-image"><img :src="row.item.preview" :width="row.item.imageWidth" :height="row.item.imageHeight" role="button" tabindex="0" aria-label="查看图片"></div>
                            <div v-else class="chatContent chatContent2 replyContentBtn" :class="{'is-image':row.item.imageOnly}" v-html="row.item.content"></div>
                        </div>
                        <div v-if="!row.item.is_kefu && (row.item.sending || row.item.failed)" class="support-send-state" :class="{'is-failed':row.item.failed}" role="status">
                            <span><{row.item.sending ? '发送中…' : (row.item.error || '发送失败')}></span>
                            <button v-if="row.item.failed" type="button" :disabled="sendDisabled || sessionFailed" @click.stop="retryMessage(row.item)">重新发送</button>
                        </div>
                    </div>
                </template>
            </chat-window>

            <div class="chatBoxSend" @click.stop>
                <p class="support-topic-hint" v-if="topicHint"><{topicHint}></p>
                <div v-if="attachment" class="support-attachment" aria-label="待发送附件">
                    <button v-if="attachment.preview" type="button" class="support-preview-image" @click="openImage(attachment.preview)" aria-label="预览待发送图片"><img :src="attachment.preview" @load="attachmentPreviewLoaded" alt="待发送图片"></button>
                    <div class="support-attachment-info"><div><{attachment.file.name}></div><small><{fileSize(attachment.file.size)}><{attachment.uploading ? ' · 上传中 '+attachment.progress+'%' : ' · 确认后发送'}></small><progress v-if="attachment.uploading" max="100" :value="attachment.progress" aria-label="附件上传进度"></progress></div>
                    <div class="support-attachment-actions"><button type="button" :disabled="sendDisabled || attachment.uploading || sessionFailed" @click="confirmAttachment"><{attachment.error ? (attachment.uploadedContent ? '重试发送' : '重试上传') : '发送附件'}></button><button type="button" @click="clearAttachment">取消</button></div>
                    <div v-if="attachment.error" class="support-attachment-error" role="alert"><{attachment.error}></div>
                </div>
                <div class="support-composer">
                    <button type="button" class="support-icon support-add" aria-label="添加图片或文件" aria-controls="support-attachments" :aria-expanded="String(showIconBtns)" @click="$refs.composer.blur();showIconBtns=!showIconBtns;showFaceIcon=false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <div class="support-input-wrap">
                        <textarea ref="composer" class="support-input" rows="1" maxlength="1000" :placeholder="!showKfonline && !serviceOpen ? '留言咨询…' : '描述问题…'" aria-label="消息内容" v-model="messageContent" @keydown="onComposerKeydown" @focus="showFaceIcon=false;showIconBtns=false"></textarea>
                    </div>
                    <button type="button" class="support-icon support-face" aria-label="选择表情" aria-controls="support-faces" :aria-expanded="String(showFaceIcon)" @click="$refs.composer.blur();showFaceIcon=!showFaceIcon;showIconBtns=false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14.5c1.8 2.7 6.2 2.7 8 0"/><path d="M8.5 9h.01M15.5 9h.01" stroke-width="3"/></svg>
                    </button>
                    <button type="button" class="support-send" :disabled="sendDisabled || !!(attachment && attachment.uploading) || !messageContent.trim()" :aria-label="sendDisabled && !sessionFailed ? '正在发送' : '发送消息'" @pointerdown.prevent @click="chatToUser();showFaceIcon=false;showIconBtns=false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
                    </button>
                </div>
                <div class="support-composer-meta" v-if="messageContent.length>=800 || (messageSaved && !showKfonline && !serviceOpen)"><span role="status"><{messageSaved && !showKfonline && !serviceOpen ? '留言已保存，客服将在服务时间查看' : ''}></span><span v-if="messageContent.length>=800"><{messageContent.length}>/1000</span></div>
                <input ref="imagePicker" type="file" accept="image/jpeg,image/png,image/gif" hidden @change="attachmentChosen($event,true)">
                <input ref="filePicker" type="file" accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.7z,.mp3,.mp4" hidden @change="attachmentChosen($event,false)">
                <div id="support-attachments" class="support-attachments" v-show="showIconBtns">
                    <button type="button" id="uploadImg" @click="uploadImg('/uploadimg')"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg></span>照片</button>
                    <button type="button" id="uploadFile" @click="uploadFile('/uploadfile')"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 14h8M8 17h5"/></svg></span>文件</button>
                </div>
                <div id="support-faces" class="faceBox visitorFaceBox" v-show="showFaceIcon">
                    <div class="support-panel-label">表情</div>
                    <ul class="faceBoxList"><li v-for="(v,i) in face" :key="v.name"><button type="button" @click="faceIconClick(i)" :aria-label="v.name"><{v.emoji}></button></li></ul>
                </div>
            </div>
        </div>
        <div class="chatArticle">
            <h3 class="hotQuestionTitle">公告</h3>
            <div class="allNotice" v-html><{kefuInfo.allNotice}></div>
        </div>

        <div v-if="imageViewer" class="support-image-viewer" role="dialog" aria-modal="true" aria-label="图片预览" @click.self="closeImage" @keydown.esc.prevent.stop="closeImage" @keydown.tab.prevent="$refs.imageClose.focus()">
            <button ref="imageClose" type="button" aria-label="关闭图片预览" @click="closeImage">✕</button><img :src="imageViewer" alt="图片预览">
        </div>
        <audio id="chatMessageAudio"></audio>
        <audio id="chatMessageSendAudio"></audio>
    </template>
</div>
</body>
<script>
    var APP_CHAT_ENABLED={{.AppChatEnabled}};
    var KEFU_ID=getQuery("user_id");
    var INITIAL_VISITOR_ID=getQuery("visitor_id") || "";
    var INITIAL_VISITOR_NAME=getQuery("visitor_name") || "";
    var INITIAL_VISITOR_AVATAR=getQuery("visitor_avatar") || "";
    var REFER='{{.Refer}}';
</script>
<script>
    new Vue({
        el: '#app',
        delimiters:["<{","}>"],
        data: {
            window:window,
            server:getWsBaseUrl()+"/ws_visitor",
            socket:null,
            msgList:[],
            msgListNum:[],
            messageContent:"",
            guideExpanded:false,
            topics:['连接问题','速度慢','购买与支付','其他问题'],
            topicHint:'',
            messageSaved:false,
            attachment:null,
            imageViewer:'',
            serviceKnown:false,
            chatTitle:"正在连接...",
            visitor:{},
            face:[],
            showKfonline:false,
            serviceOpen:true,
            presenceVersion:0,
            socketClosed:false,
            focusSendConn:false,
            timer:null,
            pingTimer:null,
            sendDisabled:APP_CHAT_ENABLED,
            sessionFailed:false,
            showIconBtns:false,
            showFaceIcon:false,
            isIframe:false,
            kefuInfo:{},
            showLoadMore:false,
            historyRequest:0,
            historyLoading:false,
            historyReady:false,
            loadFailed:false,
            connectedOnce:false,
            hasNewer:false,
            listAtBottom:true,
            newerVersion:0,
            newerCursor:null,
            visibleMessageId:0,
            messages:{
                page:1,
                pagesize:5,
                list:[],
            },
        },
        methods: {
            setAgentPresence(online,name,serviceOpen){
                this.presenceVersion++;
                const hoursChanged=typeof serviceOpen==='boolean' && this.serviceOpen!==serviceOpen;
                if(typeof serviceOpen==='boolean'){this.serviceOpen=serviceOpen;this.serviceKnown=true;}
                const changed=this.showKfonline!==online;
                this.showKfonline=online;
                if(changed || hoursChanged || name || this.chatTitle==='正在连接...' || this.chatTitle==='已连接，正在获取客服状态…'){
                    this.chatTitle=online ? '客服在线' : !this.serviceOpen ? '当前休息 · 10:00–18:00（北京时间）' : '客服暂未在线，可以留言';
                }
            },
            guidanceText(){
                if(this.showKfonline) return this.kefuInfo.welcome || '描述遇到的问题，也可以附上截图，方便客服了解情况。';
                if(!this.serviceKnown) return '请描述遇到的问题，也可以附上截图。';
                if(!this.serviceOpen) return '当前为非服务时间。请描述问题并附上截图，客服将在服务时间查看留言。';
                return '客服暂未在线。你可以先留言，说明问题和出现时间。';
            },
            selectTopic(topic){
                const hints={'连接问题':'请补充使用的设备、出现问题的时间，以及错误截图。','速度慢':'请补充使用的网络、所选线路，以及大约出现问题的时间。','购买与支付':'请描述购买或支付问题；如有截图，请遮挡支付账号等敏感信息。','其他问题':'请描述具体问题，以及希望我们帮助处理的内容。'};
                this.topicHint=hints[topic] || hints['其他问题'];
                if(!this.messageContent.trim()) this.messageContent=topic+'：';
                this.$nextTick(()=>{if(this.$refs.composer) this.$refs.composer.focus();});
            },
            messageDate(item){
                return new Date(String(item.time || '').replace(' ','T'));
            },
            messageTime(item){
                const date=this.messageDate(item);
                if(!Number.isFinite(date.getTime())) return '';
                const previous=this.msgList[this.msgList.indexOf(item)-1];
                const before=previous && this.messageDate(previous);
                if(before && date.toDateString()===before.toDateString() && date-before>=0 && date-before<300000) return '';
                const now=new Date(),yesterday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
                const day=date.toDateString()===now.toDateString() ? '' : date.toDateString()===yesterday.toDateString() ? '昨天 ' : (date.getFullYear()===now.getFullYear() ? '' : date.getFullYear()+'年')+(date.getMonth()+1)+'月'+date.getDate()+'日 ';
                return day+this.digit(date.getHours())+':'+this.digit(date.getMinutes());
            },
            isConsecutive(item){
                const previous=this.msgList[this.msgList.indexOf(item)-1];
                return previous && !previous.auto_reply_type && !item.auto_reply_type && previous.is_kefu===item.is_kefu && !this.messageTime(item);
            },
            onComposerKeydown(event){
                if(event.key!=='Enter' || event.isComposing || event.keyCode===229 || event.shiftKey) return;
                if(window.matchMedia('(pointer:fine)').matches){event.preventDefault();this.chatToUser();}
            },
            resizeComposer(){
                const input=this.$refs.composer;
                if(!input) return;
                input.style.height='auto';
                input.style.height=Math.min(input.scrollHeight,108)+'px';
            },
            syncViewport(){
                const viewport=window.visualViewport;
                if(!viewport || viewport.scale!==1) return;
                this.$el.style.setProperty('--chat-viewport',viewport.height+'px');
                this.$el.style.setProperty('--chat-offset',viewport.offsetTop+'px');
                this.$el.classList.toggle('keyboard-open',window.innerHeight-viewport.height>120);
            },
            initConn:function() {
                if(APP_CHAT_ENABLED && this.sessionFailed) return;
                if(this.socket) this.socket.close();
                let socket = new ReconnectingWebSocket(this.server+"?visitor_id="+encodeURIComponent(this.visitor.visitor_id),null,{timeoutInterval:10000});
                this.socket = socket
                this.socket.onmessage = (event) => this.OnMessage(event);
                this.socket.onopen = () => this.OnOpen();
                this.socket.onconnecting = () => {
                    if(this.sessionFailed || this.socketClosed) return;
                    this.setAgentPresence(false);
                    this.chatTitle='实时连接中断，正在重连…';
                };
                this.socket.onclose = (event) => {
                    if(APP_CHAT_ENABLED && event && event.code === 4001) { this.sessionExpired(); return; }
                    this.OnClose();
                };
                this.ping();
            },
            OnOpen:function() {
                console.log("ws:onopen");
                if(this.connectedOnce || !this.historyLoading){
                    this.messages.page=1;
                    this.showLoadMore=true;
                    this.historyLoading=false;
                    this.getHistoryMessage();
                }
                this.connectedOnce=true;
                this.chatTitle='已连接，正在获取客服状态…';
                this.socketClosed=false;
                this.focusSendConn=false;
                this.getNotice();
            },
            OnMessage:function(e) {
                console.log("ws:onmessage");
                this.socketClosed=false;
                this.focusSendConn=false;
                const redata = JSON.parse(e.data);
                if(redata.type==='pong' && redata.data && typeof redata.data.online==='boolean'){
                    this.setAgentPresence(redata.data.online,undefined,redata.data.service_open);
                }
                if (redata.type == "kfOnline") {
                    let msg = redata.data
                    this.visitor.to_id=msg.id;
                    this.setAgentPresence(true,msg.name,msg.service_open);
                    this.scrollBottom();
                }
                if (redata.type == "transfer") {
                    var kefuId = redata.data
                    if(!kefuId){
                        return;
                    }
                    this.visitor.to_id=kefuId;
                    KEFU_ID=kefuId;
                    this.setAgentPresence(false);
                    this.getNotice();
                }
                if (redata.type == "notice") {
                    let msg = redata.data
                    if(!msg){
                        return;
                    }
                    this.chatTitle=msg
                    this.showTitle(this.chatTitle);
                    this.scrollBottom();
                }
                if (redata.type == "message") {
                    let msg = redata.data
                    this.visitor.to_id=msg.id;
                    if(msg.message_id && this.msgList.some(message=>message.id==msg.message_id)){ return; }

                    let content = {}
                    content.avator = msg.avator;
                    content.name = msg.name;
                    content.content =replaceContent(msg.content);
                    content.imageOnly=this.isImageContent(msg.content);
                    content.is_kefu = true;
                    content.time = msg.time;
                    content.id = msg.message_id;
                    content.auto_reply_type = msg.auto_reply_type || '';
                    const follow=this.listAtBottom && !this.hasNewer;
                    if(follow){
                        this.newerCursor=Math.max(this.newerCursor || 0,content.id || 0);
                        this.msgList.push(content);this.sortMessages();this.trimMessages();
                    }else{this.hasNewer=true;this.newerVersion++;}

                    notify(msg.name, {
                        body: msg.content,
                        icon: msg.avator
                    },function(notification) {
                        window.focus();
                        notification.close();
                    });
                    if(follow){this.scrollBottom();}
                    flashTitle();
                    clearInterval(this.timer);
                    this.alertSound();
                }
                if (redata.type == "close") {
                    this.setAgentPresence(false);
                    this.socketClosed=true;
                    this.chatTitle="会话已结束";
                    this.showTitle(this.chatTitle);
                    this.scrollBottom();
                    this.socket.close();
                    this.focusSendConn=true;
                }
                if (redata.type == "force_close") {
                    this.setAgentPresence(false);
                    this.chatTitle="客服已结束会话";
                    this.showTitle(this.chatTitle);
                    this.scrollBottom();
                    this.socket.close();
                    this.socketClosed=true;
                }
                if (redata.type == "auto_close") {
                    this.setAgentPresence(false);
                    this.chatTitle="因长时间无回应，会话已关闭";
                    this.showTitle(this.chatTitle);
                    this.scrollBottom();
                    this.socket.close();
                    this.socketClosed=true;
                }
                window.parent.postMessage(redata,"*");
            },
            chatToUser:function() {
                if(this.sendDisabled || (this.attachment && this.attachment.uploading)) return;
                const raw=this.messageContent.trim();
                if(!raw){this.messageContent='';return;}
                if(raw.length>1000){this.$message({message:'消息不能超过 1000 字',type:'warning'});return;}
                this.messageContent=raw;
                const failed=this.msgList.find(item=>item.failed && !item.attachment && item.rawContent===raw && item.visitor_id===this.visitor.visitor_id);
                this.sendMessage(failed || this.outgoingMessage(raw,false));
            },
            isImageContent(raw){return /^img\[[^\]]+\]$/.test(String(raw || '').trim());},
            outgoingMessage(raw,attachment){
                return {client_message_id:Date.now()+'-'+Math.random().toString(36).slice(2),
                    visitor_id:this.visitor.visitor_id,rawContent:raw,attachment:!!attachment,
                    avator:this.visitor.avator,name:this.visitor.name,content:replaceContent(raw),
                    is_kefu:false,time:this.getNowDate(),sending:false,failed:false,error:'',id:0,
                    preview:'',imageWidth:150,imageHeight:150,imageOnly:this.isImageContent(raw)};
            },
            retryMessage(item){
                if(!item.failed || item.visitor_id!==this.visitor.visitor_id) return;
                this.sendMessage(item);
            },
            sendMessage(item){
                if(this.sendDisabled || this.sessionFailed || (this.attachment && this.attachment.uploading)) return;
                if(this.socketClosed){this.$message({message:'连接已关闭，请重新进入客服',type:'warning'});return;}
                if(!this.msgList.includes(item) && this.msgList.filter(message=>message.failed || message.sending).length>=200){
                    this.$message({message:'未发送消息较多，请先重试已有消息',type:'warning'});return;
                }
                if(this.hasNewer || !this.listAtBottom) this.showLatestMessages();
                this.sendDisabled=true;
                this.messageSaved=false;
                item.sending=true;item.failed=false;item.error='';
                if(!this.msgList.includes(item)) this.msgList.push(item);
                this.trimMessages();this.scrollBottom();
                let sent=false;
                $.ajax({url:'/2/message',type:'post',timeout:15000,
                    data:{type:'visitor',content:item.rawContent,client_message_id:item.client_message_id,from_id:item.visitor_id,to_id:this.visitor.to_id},
                    success:res=>{
                        if(item.visitor_id!==this.visitor.visitor_id) return;
                        if(res.code!==200 || !res.result || !res.result.message_id){
                            item.error=res.msg || '发送失败';
                            this.$message({message:item.error,type:'error'});return;
                        }
                        sent=true;item.sending=false;item.failed=false;item.id=res.result.message_id;
                        this.msgList=this.msgList.filter(message=>message===item || message.id!==item.id);
                        this.sortMessages();
                        if(!item.attachment && this.messageContent===item.rawContent){this.messageContent='';this.topicHint='';}
                        this.messageSaved=true;
                        clearInterval(this.timer);this.sendSound();
                    },
                    error:()=>{if(item.visitor_id===this.visitor.visitor_id){item.error='发送失败，请重试';this.$message({message:item.error,type:'error'});}},
                    complete:()=>{
                        if(item.visitor_id!==this.visitor.visitor_id) return;
                        this.sendDisabled=this.sessionFailed;
                        if(!sent){item.sending=false;item.failed=true;this.sortMessages();}
                    }
                });
                return true;
            },
            OnClose:function() {
                this.setAgentPresence(false);
                if(!this.socketClosed && !this.sessionFailed){this.chatTitle='连接中断，正在重连…';}
                if(APP_CHAT_ENABLED && !this.sessionFailed){
                    $.ajax({url:'/visitor/session',type:'GET',error:()=>this.sessionExpired()});
                }
                console.log("ws:onclose");
                this.focusSendConn=true;
            },
            sessionExpired:function(){
                if(this.sessionFailed) return;
                this.clearAttachment();
                this.setAgentPresence(false);
                this.sessionFailed=true;
                this.sendDisabled=true;
                this.socketClosed=true;
                this.chatTitle="客服会话已失效，请返回 App 重新进入";
                if(this.socket) this.socket.close();
                if(this.pingTimer) clearInterval(this.pingTimer);
                window.dispatchEvent(new CustomEvent('support-session-expired'));
                if(window.GoFlySupport && typeof window.GoFlySupport.postMessage==='function') {
                    window.GoFlySupport.postMessage(JSON.stringify({type:'support_session_expired'}));
                }
            },
            getAppSession:function(){
                const ticket=window.GOFLY_ENTRY_TICKET;
                window.GOFLY_ENTRY_TICKET='';
                $.ajax({
                    url:'/visitor/session', type:ticket?'POST':'GET',
                    timeout:12000,
                    contentType:'application/json', data:ticket?JSON.stringify({ticket:ticket}):undefined,
                    success:(res)=>{
                        if(res.code!==200){this.sessionExpired();return;}
                        this.visitor=res.result;
                        KEFU_ID=this.visitor.to_id;
                        this.sessionFailed=false;
                        this.sendDisabled=false;
                        // 首屏消息不等待实时连接，弱网下也能先查看历史记录。
                        this.getHistoryMessage();
                        this.initConn();
                    },
                    error:(xhr)=>{
                        if(xhr.status===401 || xhr.status===403){this.sessionExpired();return;}
                        this.loadFailed=true;
                        this.chatTitle='连接失败，请返回后重试';
                    }
                });
            },
            getUserInfo:function(){
                if(APP_CHAT_ENABLED){this.getAppSession();return;}
                let obj=this.getCache("visitor_"+KEFU_ID);
                var visitor_id=INITIAL_VISITOR_ID;
                var to_id=KEFU_ID;
                if(!visitor_id && obj){
                    visitor_id=obj.visitor_id;
                }
                let _this=this;
                var extra=getQuery("extra");
                if(!extra && (INITIAL_VISITOR_NAME || INITIAL_VISITOR_AVATAR)){
                    var extraObj={visitorName:INITIAL_VISITOR_NAME,visitorAvatar:INITIAL_VISITOR_AVATAR};
                    extra=btoa(unescape(encodeURIComponent(JSON.stringify(extraObj)))).replace(/=+$/, "");
                }
                $.post("/visitor_login",{visitor_id:visitor_id,refer:REFER,to_id:to_id,extra:extra},function(res){
                    if(res.code!=200){
                        _this.$message({
                            message: res.msg,
                            type: 'error'
                        });
                        _this.sendDisabled=true;
                        return;
                    }
                    _this.visitor=res.result;
                    _this.setCache("visitor_"+KEFU_ID,res.result);
                    _this.initConn();
                });
            },
            getHistoryMessage:function(direction){
                if(this.historyLoading){ return; }
                this.historyLoading=true;
                const request=++this.historyRequest;
                const newer=direction==='newer';
                const version=this.newerVersion;
                let params={
                    page:this.messages.page,
                    pagesize: this.messages.pagesize,
                    visitor_id: this.visitor.visitor_id,
                }
                const persisted=this.msgList.filter(message=>message.id && !message.sending);
                const boundary=newer ? persisted[persisted.length-1] : persisted[0];
                if(boundary && (newer || params.page>1)){params[newer?'after_id':'before_id']=newer ? (this.newerCursor || boundary.id) : boundary.id;}
                const latest=!newer && params.page==1;
                // 成功后只替换旧快照，保留请求期间收到或仍在发送的消息。
                const previousMessages=new Set(latest ? this.msgList.filter(message=>!message.sending && !message.failed) : []);
                let _this=this;
                $.ajax({
                    url:"/2/messagesPages",
                    type:"get",
                    timeout:12000,
                    data:params,
                    // 访客 token 由 /visitor_login 下发，用来证明「我就是这个访客」。
                    headers:{"token":this.visitor.token||""},
                    success:function(res){
                    if(res.code!=200 || request!=_this.historyRequest || params.visitor_id!=_this.visitor.visitor_id){
                        return;
                    }
                    if(latest){
                        _this.historyReady=true;
                        _this.loadFailed=false;
                        _this.msgList=_this.msgList.filter(message=>!previousMessages.has(message));
                    }
                    let msgList=res.result.list;
                    if(latest){_this.newerCursor=0;}
                    if(latest || newer){
                        for(const message of msgList){_this.newerCursor=Math.max(_this.newerCursor || 0,message.id);}
                    }
                    if(newer){_this.hasNewer=msgList.length>=params.pagesize || version!=_this.newerVersion;}
                    else{_this.showLoadMore=msgList.length>=params.pagesize;}
                    if(latest){_this.hasNewer=version!=_this.newerVersion;}
                    for(let i in msgList){
                        let item = msgList[i];
                        if(_this.msgList.some(message=>message.id==item.id)){ continue; }
                        if (item["mes_type"] == "kefu") {
                            item.is_kefu = true;
                            item.avator=item["kefu_avator"];

                        } else {
                            item.is_kefu = false;
                            item.avator=item["visitor_avator"];
                        }
                        item.time = item["create_time"];
                        item.imageOnly=_this.isImageContent(item.content);
                        item.content=replaceContent(item["content"]);
                        _this.msgList.unshift(item);
                    }
                    _this.sortMessages();
                    _this.trimMessages(newer || latest ? 'newer' : 'older');
                    if((newer || latest) && _this.msgList.some(message=>message.id>_this.newerCursor)){_this.hasNewer=true;}
                    if(latest){
                        _this.scrollBottom(true);
                    }
                    if(!newer){_this.messages.page=params.page+1;}
                    },
                    complete:function(){
                        if(request==_this.historyRequest){
                            _this.historyLoading=false;
                            if(!_this.historyReady){_this.loadFailed=true;_this.showLoadMore=true;}
                        }
                    }
                });
            },
            sortMessages:function(){
                const pending=this.msgList.filter(message=>message.sending || message.failed);
                const messages=this.msgList.filter(message=>!message.sending && !message.failed);
                const persisted=messages.filter(message=>message.id).sort((a,b)=>a.id-b.id);
                let index=0;
                this.msgList=messages.map(message=>message.id ? persisted[index++] : message).concat(pending);
            },
            trimMessages(direction){
                const cache=ChatWindow.retain(this.msgList,direction || 'newer');
                this.msgList=cache.items;
                if(cache.older){this.showLoadMore=true;}
                if(cache.newer){
                    this.hasNewer=true;
                    const saved=this.msgList.filter(message=>message.id && !message.sending);
                    if(saved.length){this.newerCursor=Math.min(saved[saved.length-1].id,this.newerCursor || Infinity);}
                }
            },
            onListPosition(position){
                this.listAtBottom=position.bottom;
            },
            getNewerMessages(){if(this.newerCursor===0){this.showLatestMessages();}else{this.getHistoryMessage('newer');}},
            showLatestMessages(){
                this.messages.page=1;
                this.historyLoading=false;
                this.listAtBottom=true;
                this.getHistoryMessage();
            },
            scrollBottom(force){
                if(force!==true && (!this.listAtBottom || this.hasNewer)){return;}
                this.$nextTick(()=>{
                    if(this.$refs && this.$refs.messageList){this.$refs.messageList.toBottom();}
                });
            },
            getNowDate : function() {
                return new Date().toISOString();
            },
            digit : function (num) {
                return num < 10 ? '0' + (num | 0) : num;
            },
            setCache : function (key,obj){
                if(navigator.cookieEnabled&&typeof window.localStorage !== 'undefined'){
                    localStorage.setItem(key, JSON.stringify(obj));
                }
            },
            getCache : function (key){
                if(navigator.cookieEnabled&&typeof window.localStorage !== 'undefined') {
                    return JSON.parse(localStorage.getItem(key));
                }
            },
            getNotice : function (){
                let _this=this;
                const version=this.presenceVersion,agent=KEFU_ID;
                $.get("/notice?kefu_id="+encodeURIComponent(KEFU_ID),function(res) {
                    var code=res.code;
                    if(code!=200 || agent!==KEFU_ID) return;
                    _this.kefuInfo=res.result;
                    if(version===_this.presenceVersion && !_this.sessionFailed && !_this.socketClosed){
                        _this.setAgentPresence(_this.kefuInfo.online===true,_this.kefuInfo.nickname || '客服',_this.kefuInfo.service_open);
                    }
                });
            },
            initCss:function(){
                var _this=this;
                $(function () {
                    const names=['微笑','开心','大笑','眨眼','喜欢','亲亲','期待','思考','惊讶','难过','流泪','哭泣','生气','尴尬','汗','睡觉','酷','庆祝','抱抱','感谢','赞','加油','好的','胜利','鼓掌','握手','挥手','爱心','心动','鲜花','礼物','蛋糕'];
                    _this.face=Array.from('😊😄😂😉😍😘🤩🤔😮😔😢😭😠😅😓😴😎🥳🤗🙏👍💪👌✌👏🤝👋❤💕🌷🎁🎂', (emoji,index)=>({emoji:emoji,name:names[index]}));
                });
            },
            ping:function(){
                let _this=this;
                let mes = {type:"ping", data:"visitor:"+_this.visitor.visitor_id};
                if(this.pingTimer){
                    clearInterval(this.pingTimer);
                }
                this.pingTimer=setInterval(function () {
                    if(_this.socket && _this.socket.readyState === WebSocket.OPEN){
                        _this.socket.send(JSON.stringify(mes));
                    }
                },10000);
            },
            init:function(){
                var _this=this;
                this.initCss();
                $('body').click(function(){
                    clearFlashTitle();
                    window.parent.postMessage({type:"focus"},"*");
                    _this.showFaceIcon=false;
                    _this.showIconBtns=false;
                });
                window.onfocus = function () {
                    clearFlashTitle();
                    window.parent.postMessage({type:"focus"},"*");
                    if(_this.socketClosed || _this.sessionFailed){
                        return;
                    }
                    if(!_this.focusSendConn){
                        return;
                    }
                    _this.initConn();
                    _this.scrollBottom();
                }
            },
            faceIconClick:function(index){
                const token=this.face[index].emoji;
                if(this.messageContent.length+token.length>1000) return;
                this.messageContent+=token;
            },
            uploadImg(){this.$refs.imagePicker.click();},
            uploadFile(){this.$refs.filePicker.click();},
            attachmentChosen(event,image){
                this.selectAttachment(event.target.files && event.target.files[0],image);
                event.target.value='';
            },
            selectAttachment(file,image){
                if(!file || this.sessionFailed) return;
                if(this.attachment){this.$message({message:'请先发送或取消当前附件',type:'warning'});return;}
                const imageTypes=['image/jpeg','image/png','image/jpg','image/gif'];
                const extensions=['png','jpg','jpeg','gif','webp','pdf','txt','csv','doc','docx','xls','xlsx','ppt','pptx','zip','rar','7z','mp3','mp4'];
                const ext=String(file.name || '').split('.').pop().toLowerCase();
                if((image && !imageTypes.includes(file.type)) || (!image && !extensions.includes(ext))){this.$message({message:'不支持此文件类型',type:'warning'});return;}
                const maxSize=(image ? 10 : 20)*1024*1024;
                if(file.size>maxSize){this.$message({message:image ? '图片不能超过 10MB' : '文件不能超过 20MB',type:'warning'});return;}
                this.attachment={file,image,preview:image ? URL.createObjectURL(file) : '',imageWidth:150,imageHeight:150,uploading:false,progress:0,error:'',uploadedContent:''};
                this.messageSaved=false;
                this.showIconBtns=false;this.showFaceIcon=false;
            },
            clearAttachment(){
                const item=this.attachment;
                if(!item) return;
                this.attachment=null;
                if(this._uploadRequest){this._uploadRequest.abort();this._uploadRequest=null;}
                if(this.imageViewer===item.preview) this.closeImage();
                if(item.preview) URL.revokeObjectURL(item.preview);
            },
            attachmentPreviewLoaded(event){
                const item=this.attachment,image=event.target;
                if(!item || image.src!==item.preview || !image.naturalWidth || !image.naturalHeight) return;
                const scale=Math.min(180/image.naturalWidth,300/image.naturalHeight,1);
                item.imageWidth=Math.max(1,Math.round(image.naturalWidth*scale));
                item.imageHeight=Math.max(1,Math.round(image.naturalHeight*scale));
            },
            releaseMessagePreviews(){
                if(!this._messagePreviews) return;
                const used=new Set(this.msgList.map(message=>message.preview));
                used.add(this.imageViewer);
                for(const url of this._messagePreviews){
                    if(!used.has(url)){URL.revokeObjectURL(url);this._messagePreviews.delete(url);}
                }
            },
            fileSize(bytes){return bytes<1024*1024 ? Math.ceil(bytes/1024)+' KB' : (bytes/(1024*1024)).toFixed(1)+' MB';},
            confirmAttachment(){
                const item=this.attachment;
                if(!item || item.uploading || this.sendDisabled || this.sessionFailed) return;
                if(this.socketClosed){this.$message({message:'连接已关闭，请重新进入客服',type:'warning'});return;}
                if(item.uploadedContent){
                    const message=this.outgoingMessage(item.uploadedContent,true);
                    message.preview=item.preview;message.imageWidth=item.imageWidth;message.imageHeight=item.imageHeight;
                    if(this.sendMessage(message)){
                        if(item.preview){
                            if(!this._messagePreviews) this._messagePreviews=new Set();
                            this._messagePreviews.add(item.preview);
                            item.preview='';
                        }
                        this.clearAttachment();
                    }
                    return;
                }
                item.uploading=true;item.error='';item.progress=0;
                const form=new FormData();form.append(item.image ? 'imgfile' : 'realfile',item.file);
                if(APP_CHAT_ENABLED) form.append('visitor_id',this.visitor.visitor_id);
                const visitor=this.visitor.visitor_id;
                this._uploadRequest=$.ajax({url:item.image ? '/uploadimg' : '/uploadfile',type:'post',timeout:120000,
                    data:form,contentType:false,processData:false,dataType:'json',
                    xhr:()=>{
                        const xhr=new XMLHttpRequest();
                        xhr.upload.addEventListener('progress',event=>{if(event.lengthComputable && this.attachment===item) item.progress=Math.round(event.loaded/event.total*100);});
                        return xhr;
                    },
                    success:res=>{
                        if(this.attachment!==item || visitor!==this.visitor.visitor_id || this.sessionFailed) return;
                        if(res.code!==200 || !res.result || !res.result.path){item.error=res.msg || '上传失败，请重试';return;}
                        const result=res.result;
                        item.uploadedContent=item.image ? 'img[/'+result.path+']' : 'attachment['+JSON.stringify({name:result.name,ext:result.ext,size:result.size,path:'/'+result.path})+']';
                        this._uploadRequest=null;item.uploading=false;
                        this.confirmAttachment();
                    },
                    error:()=>{if(this.attachment===item) item.error='上传失败，请重试';},
                    complete:()=>{if(this.attachment===item){item.uploading=false;this._uploadRequest=null;}}
                });
            },
            onPasteUpload(event){
                const items=event.clipboardData && event.clipboardData.items;
                if(!items) return;
                for(const item of items){
                    if(item.type.indexOf('image/')===0){event.preventDefault();this.selectAttachment(item.getAsFile(),true);return;}
                }
            },
            onMessageClick(event){
                const target=event.target;
                if(target.tagName==='IMG' && !target.hasAttribute('alt') && !target.closest('.productCard')){
                    event.preventDefault();event.stopPropagation();this.openImage(target.src);
                }
            },
            onMessageKeydown(event){if(event.key==='Enter' || event.key===' '){this.onMessageClick(event);}},
            openImage(src){
                this._imageFocus=document.activeElement;
                this.imageViewer=src;
                this.$nextTick(()=>{if(this.$refs.imageClose) this.$refs.imageClose.focus();});
            },
            closeImage(){
                this.imageViewer='';
                if(this._imageFocus && this._imageFocus.isConnected) this._imageFocus.focus();
                this._imageFocus=null;
            },
            alertSound:function(){
                alertSound("chatMessageAudio",'/static/images/alert2.ogg');
            },
            sendSound:function(){
                alertSound("chatMessageSendAudio",'/static/images/sent.ogg');
            },
            sendAjax:function(url,method,params,callback){
                let _this=this;
                $.ajax({
                    type: method,
                    url: url,
                    data:params,
                    error:function(res){
                        var data=JSON.parse(res.responseText);
                        console.log(data);
                        if(data.code!=200){
                            _this.$message({
                                message: data.msg,
                                type: 'error'
                            });
                        }
                    },
                    success: function(data) {
                        if(data.code!=200){
                            _this.$message({
                                message: data.msg,
                                type: 'error'
                            });
                        }else if(data.result!=null){
                            callback(data.result);
                        }else{
                            callback(data);
                        }
                    }
                });
            },
            showTitle:function(title){
                this.chatTitle=title;
                this.scrollBottom();
            },
        },
        watch:{
            messageContent(){if(this.messageContent) this.messageSaved=false;this.$nextTick(this.resizeComposer);},
            msgList(){this.releaseMessagePreviews();},
            imageViewer(){this.releaseMessagePreviews();},
        },
        mounted:function() {
            document.addEventListener('paste', this.onPasteUpload);
            this.syncViewport();
            if(window.visualViewport){
                window.visualViewport.addEventListener('resize',this.syncViewport);
                window.visualViewport.addEventListener('scroll',this.syncViewport);
            }
        },
        beforeDestroy:function(){
            document.removeEventListener('paste',this.onPasteUpload);
            this.clearAttachment();
            if(this._messagePreviews){for(const url of this._messagePreviews) URL.revokeObjectURL(url);this._messagePreviews.clear();}
            if(window.visualViewport){
                window.visualViewport.removeEventListener('resize',this.syncViewport);
                window.visualViewport.removeEventListener('scroll',this.syncViewport);
            }
            if(this.pingTimer){ clearInterval(this.pingTimer); }
            if(this.timer){ clearInterval(this.timer); }
            if(this.socket){ this.socket.close(); }
        },
        created: function () {
            if(APP_CHAT_ENABLED){
                $(document).ajaxError((event,xhr)=>{
                    if(xhr.status===401 || xhr.status===403){this.sessionExpired();}
                });
            }
            this.init();
            this.getUserInfo();
        }
    })
</script>
</html>
